# Postgres local para desarrollo. Levantar con: docker compose up -d
# En producción se usa Neon (Vercel) — esto es solo para el entorno local.
services:
  db:
    image: postgres:16
    container_name: proges-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: proges
      POSTGRES_PASSWORD: proges
      POSTGRES_DB: proges
    ports:
      - "5432:5432"
    volumes:
      - proges-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proges -d proges"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proges-pgdata:
